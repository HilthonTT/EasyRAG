# Default EasyRAG configuration.
# Any value can be overridden with an env var: EASYRAG_<SECTION>_<KEY>, e.g. EASYRAG_RETRIEVER_TOP_K=8

splitter:
  method: recursive # recursive | character
  chunk_size: 500
  chunk_overlap: 50

embedding:
  provider: hash # hash | sentence_transformer | openai
  model: "" # empty = the provider's default model
  batch_size: 32

vectorstore:
  provider: memory # memory | faiss (uv sync --extra faiss)
  index: flat # faiss only: flat (exact) | hnsw (approximate, fast on millions of chunks)

retriever:
  method: hybrid # vector | bm25 | hybrid
  top_k: 4
  rrf_k: 60 # reciprocal rank fusion constant (hybrid only)

reranker:
  provider: none # none | cross_encoder
  model: ""
  fetch_k: 20 # candidates retrieved before reranking down to top_k

generator:
  provider: echo # echo | anthropic | openai | ollama
  model: ""
  max_tokens: 16000
  effort: low # anthropic only: low | medium | high | xhigh | max
  base_url: "" # ollama / OpenAI-compatible servers

pipeline:
  type: naive # naive | hyde | multi_query | step_back | iterative | self_ask | ircot | self_rag | agent
  max_iterations: 3 # rounds or searches: iterative, self_ask, ircot, self_rag, agent
  num_queries: 3 # multi_query: LLM rewrites searched alongside the question
  chat_history: 5 # chat: earlier turns used to rewrite follow-ups (0 = no memory)
  index_dir: .rag_index

judge: # used by `easyrag eval --judge`
  provider: "" # empty = same as generator; anthropic | openai | ollama
  model: ""
  max_tokens: 16000
  effort: low
  base_url: ""

[project]
name = "easyrag"
version = "0.1.0"
description = "A simple, modular Retrieval-Augmented Generation (RAG) toolkit."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hilthon" }]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=1.0"]
huggingface = ["sentence-transformers>=3.0"]
pdf = ["pypdf>=4.0"]
all = ["easyrag[openai,huggingface,pdf]"]

[project.scripts]
easyrag = "easyrag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easyrag"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
